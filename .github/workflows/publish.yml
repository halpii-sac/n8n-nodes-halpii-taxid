# Publica este paquete de nodos de n8n en npm cada vez que se empuja un tag de versión.
#
# n8n exige (desde el 1 de mayo de 2026) que los nodos de la comunidad se publiquen
# desde GitHub Actions con «provenance» de npm. Este flujo lo cumple.
#
# ─── CÓMO SE AUTENTICA ─────────────────────────────────────────────────────────
#
# Sin tokens. npm confía en este repositorio y en este archivo (publish.yml) por
# «Trusted Publishing» (OIDC): GitHub entrega un token de identidad de corta vida
# y npm lo acepta. No existe el secreto NPM_TOKEN y no debe volver a crearse.
#
# El Trusted Publisher de npm solo tiene permiso de «npm stage publish»
# (publicación en espera). Por eso este flujo NO publica directo: deja la versión
# en espera y el dueño la aprueba con su llave de seguridad en
# https://www.npmjs.com/package/n8n-nodes-halpii-taxid → pestaña «Staged Packages»
# → «Approve». Hasta que se aprueba, la versión no aparece en el registro.
#
# Requisitos del runner (docs.npmjs.com/staged-publishing):
#   - Node.js 22.14.0 o superior
#   - npm CLI 11.15.0 o superior (aquí se fija una versión exacta)
#
# Nota: `n8n-node release` (npm run release) solo sabe ejecutar `npm publish`,
# que este Trusted Publisher no permite. Por eso aquí se llama a npm directamente.
# RELEASE_MODE=true es lo que pide el `prepublishOnly` del paquete (n8n-node prerelease).
#
# ─── CÓMO SACAR UNA VERSIÓN ────────────────────────────────────────────────────
#
#   1. Subir la versión en package.json y anotarla en CHANGELOG.md.
#   2. Commit y push a main.
#   3. Crear y empujar un tag igual a la versión, sin «v» (por ejemplo 0.1.1).
#   4. Cuando termine este flujo, aprobar la versión en npmjs.com (ver arriba).

name: Publish

on:
  push:
    tags:
      # Coincide con 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm (staged)
    runs-on: ubuntu-latest

    permissions:
      # Necesario para el token OIDC (Trusted Publishing y provenance).
      id-token: write
      # Mínimo privilegio: solo lectura del código.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Fijar la versión de npm
        # Staged publishing necesita npm >= 11.15.0.
        run: |
          npm install -g npm@11.21.2
          node --version
          npm --version

      - name: Comprobar que el tag coincide con package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "El tag ($GITHUB_REF_NAME) no coincide con la versión de package.json ($VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Publicar en espera (staged) con provenance
        # Autenticación por OIDC: no hay token. La versión queda en espera hasta
        # que el dueño la apruebe en npmjs.com → Staged Packages.
        run: 'npm stage publish --provenance --access public'
        env:
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
